openapi: 3.1.0
info: { title: Types 3.1, version: '2' }
servers: [ { url: http://localhost:4010 } ]
paths:
  /things/{id}:
    get:
      operationId: getThing
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: A thing
          content:
            application/json:
              schema:
                type: object
                required: [id, size]
                properties:
                  id: { type: string }
                  size: { type: [integer, 'null'] }
                  meta: { $ref: '#/components/schemas/Meta', description: Overridden description }
                  ref: { $ref: 'other.yaml#/Thing' }
components:
  schemas:
    Meta:
      type: object
      properties:
        created: { type: string, format: date }
webhooks:
  newThing:
    post: { responses: { '200': { description: ok } } }
